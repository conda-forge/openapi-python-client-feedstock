{% set name = "openapi-python-client" %}
{% set version = "0.29.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/openapi_python_client-{{ version }}.tar.gz
  sha256: 7e05c904fb4840c17b4a9fff05cc53dfd97d45b486d9462ffb7ecf9c98e67e25

build:
  number: 0
  noarch: python
  entry_points:
    - openapi-python-client = openapi_python_client.cli:app
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - hatchling
    - python {{ python_min }}
  run:
    - attrs >=22.2.0
    - colorama >=0.4.3
    - httpx >=0.23.1,<0.29.0
    - jinja2 >=3.0.0,<4.0.0
    - pydantic >=2.10,<3.0.0
    - python >={{ python_min }}
    - ruamel.yaml >=0.18.6,<0.20.0
    - ruff >=0.2
    - shellingham >=1.3.2,<2.0.0
    - typer >0.16,<0.27

test:
  imports:
    - openapi_python_client
  commands:
    - pip check
    - openapi-python-client --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/triaxtec/openapi-python-client
  summary: Generate modern Python clients from OpenAPI
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - wolfgang-noichl
    - asford
    - tdsmith
